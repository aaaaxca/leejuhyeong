<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>애프터이펙트 1 · 이주형 클래스</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    color-scheme:dark;
    --bg:#0e0e0f; --panel:#161617; --ink:#ecebe7; --sub:#9b9a96; --faint:#68676a; --line:#262628;
    --accent:#e6e3dc; --accent-ink:#0e0e0f;
    --c-plan:#7d7d80; --c-wip:#c29a5c; --c-live:#7fa487; --c-done:#8e9db5;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.6;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:1040px;margin:0 auto;padding:56px 24px 96px}
  header{margin-bottom:40px;padding-bottom:24px;border-bottom:1px solid var(--line)}
  .crumb{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--faint);margin-bottom:14px;letter-spacing:.01em}
  .crumb a{color:var(--sub);text-decoration:none} .crumb a:hover{color:var(--ink)}
  .crumb b{color:var(--ink);font-weight:500}
  .eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:0 0 10px}
  h1{font-family:"Noto Serif KR",serif;font-size:32px;font-weight:600;margin:0;letter-spacing:-.02em}
  .lead{color:var(--sub);margin:8px 0 0;font-size:14px}
  .head-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px;max-width:480px}

  /* 1단계: 세로 카테고리 */
  .cats{display:flex;flex-direction:column;border-top:1px solid var(--line)}
  .ic{display:inline-grid;place-items:center;color:var(--sub)}
  .ic svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
  .cat .ic{width:48px;height:48px;padding:12px;border:1px solid var(--line);border-radius:50%;transition:.2s}
  .cat:hover .ic{color:var(--ink);border-color:var(--sub)}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
  .card .ic{width:22px;height:22px}
  .lead-ic{width:28px;height:28px;margin-bottom:14px;color:var(--sub)}
  .cat{display:grid;grid-template-columns:64px 1fr auto 24px;align-items:center;gap:20px;text-decoration:none;color:inherit;
    padding:32px 8px;border-bottom:1px solid var(--line);transition:background .2s}
  .cat:hover{background:var(--panel)}
  .cat .num{font-size:13px;color:var(--faint);font-variant-numeric:tabular-nums;letter-spacing:.05em}
  .cat h2{margin:0;font-size:22px;font-weight:500;letter-spacing:-.01em}
  .cat p{margin:4px 0 0;color:var(--sub);font-size:14px}
  .cat .cnt{font-size:13px;color:var(--sub);white-space:nowrap}
  .cat .arr{color:var(--faint);transition:transform .2s}
  .cat:hover .arr{transform:translateX(4px);color:var(--ink)}

  /* 2·3단계 카드 */
  .grp{margin-bottom:44px}
  .grp-head{display:flex;align-items:baseline;gap:10px;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
  .grp-head h2{margin:0;font-size:15px;font-weight:600;letter-spacing:.01em}
  .grp-head span{font-size:12px;color:var(--faint)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:22px 20px;
    display:flex;flex-direction:column;gap:8px;min-height:168px;color:inherit;text-decoration:none;transition:border-color .2s}
  a.card:hover{border-color:var(--sub)}
  .no{font-size:11px;color:var(--faint);letter-spacing:.1em;font-variant-numeric:tabular-nums}
  .card h3{font-size:16px;font-weight:600;margin:0;letter-spacing:-.01em}
  .card p{margin:0;font-size:13px;color:var(--sub)}
  .card .more{font-size:12px;color:var(--faint)}
  .meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:auto;padding-top:12px;border-top:1px solid var(--line);font-size:12px}
  .tag{color:var(--sub)}
  .st{display:inline-flex;align-items:center;gap:6px;color:var(--sub)}
  .st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
  .st.plan{color:var(--c-plan)} .st.wip{color:var(--c-wip)} .st.live{color:var(--c-live)} .st.done{color:var(--c-done)}
  .row{display:flex;gap:6px}
  .btn{flex:1;text-align:center;text-decoration:none;font-size:13px;font-weight:500;padding:8px 10px;border-radius:4px;
    border:1px solid var(--line);color:var(--ink);background:transparent;cursor:pointer;font-family:inherit}
  .btn:hover{border-color:var(--sub)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .btn[aria-disabled=true]{opacity:.35;pointer-events:none}
  .btn.copy{flex:0 0 auto}
  .empty{color:var(--sub);font-size:14px;padding:40px;border:1px dashed var(--line);border-radius:6px;text-align:center}


  /* 번호 잠금 */
  .pin-modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:20px;z-index:30;backdrop-filter:blur(2px)}
  .pin-modal.on{display:flex}
  .gate{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:22px 24px 12px;width:min(260px,100%);text-align:center;position:relative}
  .gate h4{margin:0 0 2px;font-size:14px;font-weight:600}
  .gate .x{position:absolute;top:6px;right:10px;background:none;border:0;color:var(--faint);font-size:16px;cursor:pointer}
  .gate p{color:var(--sub);font-size:12px;margin:0 0 14px}
  .pins{display:flex;gap:6px;justify-content:center}
  .pins input{width:140px;height:34px;text-align:center;font:inherit;font-size:14px;letter-spacing:.12em;padding-left:.12em;border:1px solid var(--line);
    border-radius:6px;background:var(--panel);color:var(--ink);outline:none}
  .pins input:focus{border-color:var(--sub)}
  .gate .err{color:#d08a7c;font-size:11px;height:16px;margin-top:8px}
  .shake{animation:sh .35s}
  @keyframes sh{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
  .cat .lock{font-size:12px;color:var(--faint)}

  /* 3단계: 과정 상세 */
  .d-eyebrow{display:inline-block;font-size:11px;letter-spacing:.12em;color:var(--sub);border:1px solid var(--line);
    border-radius:999px;padding:4px 12px;margin-bottom:18px}
  .d-title{font-size:36px}
  .d-title .sub{color:var(--sub);font-weight:500}
  .d-lead{max-width:560px;font-size:15px;line-height:1.75;margin-top:14px}
  .d-sec{font-family:"Noto Serif KR",serif;font-size:20px;font-weight:500;margin:0 0 18px}
  .pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .pcard{border:1px solid var(--line);border-radius:8px;padding:16px 16px 14px;min-height:112px;
    display:flex;flex-direction:column;gap:6px;background:var(--panel);color:inherit;text-decoration:none;transition:border-color .2s}
  .pcard .pno{font-size:11px;color:var(--faint);letter-spacing:.08em;font-variant-numeric:tabular-nums}
  .pcard h3{margin:0;font-size:15px;font-weight:600}
  .pcard .ps{margin-top:auto;font-size:12px;color:var(--faint)}
  .pcard.ready{border-style:dashed;background:transparent}
  .pcard.ready h3{color:var(--sub);font-weight:500}
  .pcard.sample{opacity:.55}
  a.pcard:hover{border-color:var(--sub)}
  .pcard .row{margin-top:auto}
  .pcard .btn{font-size:12px;padding:6px 8px}
  .d-foot{margin-top:56px;padding-top:18px;border-top:1px solid var(--line);font-size:12px;color:var(--faint)}
  @media (max-width:860px){ .pgrid{grid-template-columns:repeat(2,1fr)} }
  @media (max-width:460px){ .pgrid{grid-template-columns:1fr} .d-title{font-size:27px} }
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);
    padding:10px 16px;border-radius:4px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:20}
  .toast.show{opacity:1}
  @media (max-width:600px){
    .wrap{padding:36px 16px 72px} h1{font-size:24px}
    .cat{grid-template-columns:40px 1fr 16px;gap:12px;padding:24px 4px} .cat .ic{width:40px;height:40px;padding:10px} .cat .cnt{display:none} .cat h2{font-size:18px}
  }

  .stu header{margin-bottom:40px}
  a.pcard{cursor:pointer}
  a.pcard .ps{color:var(--sub)}
  .notice{color:var(--sub);font-size:14px;padding:32px;border:1px dashed var(--line);border-radius:8px;text-align:center}

  .tbar{display:none;position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
  .tbar.on{display:block}
  .tbar a{display:block;max-width:1040px;margin:0 auto;padding:10px 24px;font-size:13px;color:var(--sub);text-decoration:none}
  .tbar a:hover{color:var(--ink)}
</style>
</head>
<body class="stu">
<div class="tbar" id="tbar"><a href="../index.html#/course">← 이주형 클래스로 돌아가기</a></div><script>try{if(sessionStorage.getItem("hub-ok")==="1")document.getElementById("tbar").classList.add("on")}catch(e){}</script>
<div class="wrap">
  <header>
    <span class="d-eyebrow">SBS아카데미AIX 안산 · 모션</span>
    <h1 class="d-title">애프터이펙트 1</h1>
    
  </header>
  <main>
    <h2 class="d-sec">수업 자료</h2>
    <div class="notice">수업 자료가 곧 올라옵니다.</div>
    <div class="d-foot">SBS아카데미AIX 안산 · 애프터이펙트 1</div>
  </main>
</div>
</body>
</html>
